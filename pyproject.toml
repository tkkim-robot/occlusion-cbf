[project]
name = "occlusion-cbf"
version = "0.1.0"
description = "Occlusion CBF Safety Control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "matplotlib",
    "cvxpy",
    "casadi",
    "shapely>=2.0.7",
    "gurobipy",
    "jax>=0.4.30",
    "optuna>=3.6",
    "pyyaml>=6.0",
    "wandb>=0.17",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "base_control*",
    "dynamic_env*",
    "examples*",
    "position_control*",
    "utils*",
]

[tool.setuptools.package-data]
"position_control.ocbf" = ["config/*.yaml"]
